name: Deploy Web (GitHub Pages)

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Must match the repository name EXACTLY (case-sensitive Pages path).
  REPO_NAME: Youtube-Filtering
  FLUTTER_VERSION: 3.22.3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      # Regenerate platform folders (web/) that are gitignored.
      - name: flutter create
        run: flutter create --platforms web --project-name youtube_filtering .

      # Overwrite default Flutter branding with the YouTube-filter icons.
      - name: Inject app branding (icons, manifest, title)
        run: |
          cp web_assets/manifest.json web/manifest.json
          cp web_assets/favicon.png web/favicon.png
          cp web_assets/icon.svg web/icon.svg
          cp web_assets/apple-touch-icon.png web/apple-touch-icon.png
          mkdir -p web/icons
          cp web_assets/icons/*.png web/icons/
          # <title> + theme-color + svg favicon + apple touch icon
          sed -i 's#<title>[^<]*</title>#<title>피드필터 – YouTube 카테고리</title>#' web/index.html
          sed -i 's#<meta name="apple-mobile-web-app-title" content="[^"]*">#<meta name="apple-mobile-web-app-title" content="피드필터">#' web/index.html
          sed -i 's#<meta name="description" content="[^"]*">#<meta name="description" content="구독 피드를 카테고리로 걸러 보는 YouTube 필터">#' web/index.html
          # add svg favicon + apple-touch-icon + theme-color right after the png favicon link
          sed -i 's#<link rel="icon" type="image/png" href="favicon.png"/>#<link rel="icon" type="image/png" href="favicon.png"/>\n  <link rel="icon" type="image/svg+xml" href="icon.svg"/>\n  <link rel="apple-touch-icon" href="apple-touch-icon.png"/>\n  <meta name="theme-color" content="#E01E1E"/>#' web/index.html

      - name: Write .env from secrets
        run: |
          cat > .env <<EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          EOF

      - name: pub get
        run: flutter pub get

      - name: Build web
        run: |
          flutter build web --release \
            --pwa-strategy none \
            --web-renderer canvaskit \
            --base-href "/${REPO_NAME}/" \
            --dart-define=BUILD_ID=${GITHUB_SHA}

      - name: version-info.json + cache busting
        run: |
          SHORT_SHA="${GITHUB_SHA::10}"
          printf '{"build":"%s","time":"%s"}\n' \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > build/web/version-info.json
          # bust the 10-minute Pages cache on the entrypoint scripts
          sed -i "s/flutter_bootstrap.js/flutter_bootstrap.js?v=${SHORT_SHA}/g" build/web/index.html || true
          sed -i "s/main.dart.js/main.dart.js?v=${SHORT_SHA}/g" build/web/flutter_bootstrap.js || true

      - name: SPA 404 fallback
        run: cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
